# @package _global_
# Exphormer encoder config for categorical diffusion MAX2SAT (sparse mode)
# Usage: python train.py model=exphormer  (or override individual keys)

# ── Encoder ───────────────────────────────────────────────────────────────────
encoder: Exphormer
n_layers: 8
hidden_dim: 256
sparse_factor: 1          # >0 enables sparse mode (required for Exphormer)
nodes_dim: 3              # INPUT_CLASSES: {0, 1, mask=2}
edges_dim: 4
n_heads: 8
dropout: 0.0
layer_norm: false
batch_norm: true
activation: relu
use_bias: false
residual: true
use_edge_features: true
n_vn: 1                   # virtual nodes per graph (0 = disabled)
expander_degree: 4        # target degree of the random-regular expander graph
use_activation_checkpoint: false

# ── Diffusion ─────────────────────────────────────────────────────────────────
diffusion_steps: 1000
diffusion_schedule: cosine  # cosine noise schedule for CategoricalDiffusion
vocab_size: 2              # OUTPUT_CLASSES: binary {0, 1}

# ── Inference ─────────────────────────────────────────────────────────────────
inference_diffusion_steps: 50
inference_schedule: cosine
sequential_sampling: 1
parallel_sampling: 1

# ── Momentum sampling ────────────────────────────────────────────────────────────────────
use_momentum:    false     # true = use momentum sampler at test/inference time
momentum_a:      0.9      # EMA coefficient for first moment  (velocity)
momentum_b:      0.1      # logit-gradient contribution scale
momentum_c:      0.01     # EMA coefficient for second moment (variance)
momentum_epsilon: 1.0e-3  # numerical stability denominator
